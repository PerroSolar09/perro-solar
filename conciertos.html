<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conciertos | Perro Solar</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/conciertos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

</head>


<body>


<header>

    <div class="logo">

        <a href="index.html" aria-label="Inicio">

            <img
                src="images/Logo/perrosolarlogo.png"
                alt="Perro Solar">

        </a>

    </div>


    <button
        class="menu-toggle"
        aria-label="Abrir menú">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <nav>

        <a href="historia.html">
            Historia
        </a>

        <a href="musica.html">
            Música
        </a>

        <a href="galeria.html">
            Galería
        </a>

        <a href="conciertos.html">
            Conciertos
        </a>

        <a href="contacto.html">
            Contacto
        </a>

    </nav>

</header>


<main>


    <section class="concerts">


        <div class="concert-container">


            <!-- ENCABEZADO -->

            <div class="concert-header">

                <span class="concert-kicker">
                    PRÓXIMO CONCIERTO
                </span>

                <div class="concert-line"></div>

            </div>


            <!-- EVENTO -->

            <article class="concert-event">


                <!-- FLYER -->

                <div class="concert-poster">

                    <img
                        src="images/flyers/festivalroackalpueblo.webp"
                        alt="Perro Solar en el Festival Rock al Pueblo - Domingo 01 de noviembre de 2026">

                </div>


                <!-- INFORMACIÓN -->

                <div class="concert-content">


                    <div class="event-date">

                        <span class="date-day">
                            01
                        </span>

                        <div class="date-text">

                            <span>
                                DOMINGO
                            </span>

                            <span>
                                NOVIEMBRE
                            </span>

                        </div>

                    </div>


                    <div class="event-time">
                        Desde las 12:00 PM
                    </div>


                    <div class="event-divider"></div>


                    <div class="event-venue">

                        <span class="venue-label">
                            LUGAR
                        </span>

                        <h1>
                            Parque Principal de La Mesa
                        
                        </h1>

                        <p>
                            Calle 9 # 22 - 84 
                            <br>
                            La Mesa, Cundinamarca
                        </p>


                        <a
                            href="https://maps.app.goo.gl/ZbxijTLz8A9pmwPo7"
                            class="maps-link"
                            target="_blank"
                            rel="noopener noreferrer">

                            <span>
                                Ver ubicación
                            </span>

                            <span class="maps-arrow">
                                →
                            </span>

                        </a>

                    </div>


                    <div class="free-entry">

                        <span>
                            ENTRADA LIBRE
                        </span>

                    </div>


                </div>


            </article>


        </div>


    </section>


</main>


<footer>

    <p>
        © 2026 Perro Solar · Todos los derechos reservados.
    </p>

</footer>


<script src="js/conciertos.js"></script>


</body>

</html>
