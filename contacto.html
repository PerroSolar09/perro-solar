    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/contacto.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

     <header>

       <div class="logo">

    <a href="index.html" aria-label="Inicio">

        <img
            src="images/logo/perrosolarlogo.png"
            alt="Perro Solar">

    </a>

</div>

       <nav>

    <a href="historia.html">Historia</a>

    <a href="musica.html">Música</a>

    <a href="galeria.html">Galería</a>

    <a href="conciertos.html">Conciertos</a>

    <a href="contacto.html">Contacto</a>

</nav>

    </header>

    <!-- =========================
         MAIN
    ========================== -->

    <main>

        <!-- HERO -->

        <section class="contact-hero">

            <div class="container">

                <span class="section-label">

                    Contacto

                </span>
<h1>

    Hagamos ruido<span>.</span>

</h1>

                <div class="section-divider"></div>

                <p>

                    Cuéntanos sobre tu evento, festival o proyecto musical.

                </p>

            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="contact-content">

    <div class="container">

        <div class="contact-grid">

            <!-- FORMULARIO -->

            <div class="contact-form">

                <form action="#" method="post">

                    <div class="form-group">

                        <label for="nombre">

                            Nombre

                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="correo">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="asunto">

                            Asunto

                        </label>

                        <input
                            type="text"
                            id="asunto"
                            name="asunto">

                    </div>

                    <div class="form-group">

                        <label for="mensaje">

                            Mensaje

                        </label>

                        <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="5"
                            required></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn-contacto">

                        Enviar mensaje →

                    </button>

                </form>

            </div>

            <!-- INFORMACIÓN -->

            <aside class="contact-sidebar">

                <h3>

                    Booking

                </h3>

                <p>

                    perrosolarband@gmail.com

                </p>

                <h3>

                    Ubicación

                </h3>

                <p>

                    Bogotá · Colombia

                </p>

                <div class="social-links">

                    <a href="https://www.instagram.com/perrosolar_band?igsh=MThvOWw4eDh6MGkycA%3D%3D&utm_source=qr" aria-label="Instagram">

                        <i class="fa-brands fa-instagram"></i>

                    </a>

                    <a href="#" aria-label="Spotify">

                        <i class="fa-brands fa-spotify"></i>

                    </a>

                    <a href="#" aria-label="YouTube">

                        <i class="fa-brands fa-youtube"></i>

                    </a>

                    <a href="https://www.facebook.com/share/18zunMrZb2/?mibextid=wwXIfr" aria-label="Facebook">

                        <i class="fa-brands fa-facebook-f"></i>

                    </a>

                </div>

            </aside>

        </div>

    </div>

</section>

        
    </main>

    <!-- =========================

    ========================== -->

    <footer>
